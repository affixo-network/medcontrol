<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affixo MedControl — Staging Login</title><style>body{font-family:Arial,sans-serif;max-width:680px;margin:60px auto;padding:0 16px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}input,button{font:inherit;padding:10px 12px}.row{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#666}</style></head>
<body><h1>Affixo MedControl — Staging</h1><div class="card"><p>Enter email to receive a magic link.</p><div class="row"><input id="email" type="email" autocomplete="email" placeholder="Email"><button id="send">Send magic link</button></div><p id="status" class="muted"></p></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const status=document.getElementById("status");
async function finish(){const u=new URL(location.href);if(u.searchParams.has("code")){const {error}=await supabase.auth.exchangeCodeForSession(u.searchParams.get("code"));if(error){status.textContent=error.message;return;}}const {data,error}=await supabase.auth.getSession();if(error){status.textContent=error.message;return;}if(data.session) location.replace("/app.html");}
document.getElementById("send").onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email){status.textContent="Enter email.";return;}status.textContent="Sending…";const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:`${location.origin}/auth-login.html`}});status.textContent=error?error.message:"Magic link sent.";};
await finish();
</script></body></html>
