<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MedControl — Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 60px auto; padding: 0 16px; color:#111; }
    .card { border:1px solid #ddd; border-radius:12px; padding:16px; background:#fff; }
    input, button { font: inherit; padding:10px 12px; }
    .inline { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .muted { color:#666; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p><a href="./">← Back to Home</a></p>
  <h1>MedControl — Login</h1>
  <div class="card">
    <p>Enter email and send magic link.</p>
    <div class="inline">
      <input id="email" type="email" placeholder="Email" style="min-width:260px;" />
      <button id="send">Send magic link</button>
    </div>
    <p class="muted" id="status"></p>
    <pre id="debug" style="margin-top:16px;color:#555; display:none; white-space:pre-wrap;"></pre>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const pageUrl = new URL(window.location.href);
const baseUrl = new URL("./", pageUrl);
const loginUrl = new URL("auth-login.html", baseUrl).href;
const inputUrl = new URL("input.html", baseUrl).href;

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" }
});

const debugEl = document.getElementById("debug");
const statusEl = document.getElementById("status");
const DEBUG = pageUrl.searchParams.get("debug") === "1";

function showDebug(obj) {
  if (!DEBUG) return;
  debugEl.style.display = "block";
  debugEl.textContent = JSON.stringify(obj, null, 2);
}
function goInput() { window.location.replace(inputUrl); }

async function finishCallback() {
  const hash = new URLSearchParams(pageUrl.hash.replace(/^#/, ""));
  const accessToken = hash.get("access_token");
  const refreshToken = hash.get("refresh_token");
  const errorDescription = hash.get("error_description");

  if (errorDescription) {
    statusEl.textContent = decodeURIComponent(errorDescription.replace(/\+/g, " "));
    return false;
  }

  if (accessToken && refreshToken) {
    statusEl.textContent = "Completing sign-in…";
    const { data, error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    showDebug({ source: "setSession", data, error });
    if (error) { statusEl.textContent = error.message; return false; }
    if (data?.session) {
      history.replaceState({}, document.title, loginUrl);
      goInput();
      return true;
    }
  }

  const tokenHash = pageUrl.searchParams.get("token_hash");
  const type = pageUrl.searchParams.get("type");
  if (tokenHash && type) {
    statusEl.textContent = "Confirming email…";
    const { data, error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type });
    showDebug({ source: "verifyOtp", data, error });
    if (error) { statusEl.textContent = error.message; return false; }
    if (data?.session) {
      history.replaceState({}, document.title, loginUrl);
      goInput();
      return true;
    }
  }

  const code = pageUrl.searchParams.get("code");
  if (code) {
    statusEl.textContent = "Completing sign-in…";
    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
    showDebug({ source: "exchangeCodeForSession", data, error });
    if (!error && data?.session) {
      history.replaceState({}, document.title, loginUrl);
      goInput();
      return true;
    }
  }

  const { data, error } = await supabase.auth.getSession();
  showDebug({ source: "getSession", data, error });
  if (error) { statusEl.textContent = error.message; return false; }
  if (data?.session) { goInput(); return true; }
  return false;
}

document.getElementById("send").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) { statusEl.textContent = "Enter email."; return; }
  statusEl.textContent = "Sending sign-in link…";
  const { data, error } = await supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: loginUrl, shouldCreateUser: true }
  });
  showDebug({ source: "signInWithOtp", redirectTo: loginUrl, data, error });
  if (error) { statusEl.textContent = error.message; return; }
  statusEl.textContent = "Sign-in link sent. Open the email and follow the link.";
};

await finishCallback();
</script>
</body>
</html>
