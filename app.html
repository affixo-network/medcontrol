<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affixo MedControl — Staging</title><style>body{font-family:Arial,sans-serif;max-width:1050px;margin:32px auto;padding:0 16px;color:#111}.top,.grid,.row{display:flex;gap:10px;flex-wrap:wrap}.grid{align-items:flex-start}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;flex:1;min-width:300px}input,select,button,a{font:inherit;padding:8px 10px}.muted{color:#666}.danger{color:#a00}ul{padding-left:20px}.slot{border-top:1px solid #eee;padding:8px 0}</style></head>
<body><div class="top"><h1 style="flex:1">Affixo MedControl — Staging</h1><a href="settings.html">Settings</a><button id="logout">Logout</button></div><p id="status" class="muted">Loading…</p><p id="error" class="danger"></p><div class="grid"><section class="card"><h2>Patients</h2><div class="row"><input id="patientName" placeholder="Patient name"><input id="patientTz" value="UTC" placeholder="Timezone"><button id="createPatient">Create</button></div><ul id="patients"></ul></section><section class="card"><h2>Selected patient</h2><p id="selected">None</p><p id="role" class="muted"></p><h3>Add medication</h3><div class="row"><input id="medName" placeholder="Medication name"><input id="medValue" value="1" size="6"><input id="medUnit" value="mg" size="8"><input id="medQty" value="1" size="6"><input id="medIntakeUnit" value="tablet" size="10"><input id="medTimes" placeholder="08:00,20:00"><button id="addMedication">Add</button></div><ul id="medications"></ul></section></div><section class="card"><h2>Today / Intake</h2><div id="today"></div></section><section class="card"><h2>History</h2><div id="history"></div></section>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./supabase-config.js";const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let user=null,selectedPatient=null,selectedRole=null;function fail(e){$("error").textContent=e?.message||String(e||"");}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function zoneParts(date,timeZone){const fmt=new Intl.DateTimeFormat("en-CA",{timeZone,year:"numeric",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});const out={};for(const p of fmt.formatToParts(date))if(p.type!=="literal")out[p.type]=p.value;return out;}
function patientToday(){const z=selectedPatient?.timezone||"UTC",p=zoneParts(new Date(),z);return{date:`${p.year}-${p.month}-${p.day}`,weekday:p.weekday,timeZone:z};}
function zonedLocalToIso(dateText,timeText,timeZone){const [y,mo,d]=dateText.split("-").map(Number);const [h,mi,s=0]=String(timeText).slice(0,8).split(":").map(Number);let t=Date.UTC(y,mo-1,d,h,mi,s);for(let i=0;i<3;i++){const p=zoneParts(new Date(t),timeZone);const represented=Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day),Number(p.hour),Number(p.minute),Number(p.second));const wanted=Date.UTC(y,mo-1,d,h,mi,s);const delta=wanted-represented;if(!delta)break;t+=delta;}return new Date(t).toISOString();}
function scheduleRunsToday(s,today){if(s.schedule_type==="daily")return(!s.start_date||today.date>=s.start_date)&&(!s.end_date||today.date<=s.end_date);if(s.schedule_type==="weekdays")return(!s.start_date||today.date>=s.start_date)&&(!s.end_date||today.date<=s.end_date)&&(s.weekdays||[]).includes(today.weekday);if(s.schedule_type==="explicit_dates")return(s.explicit_dates||[]).includes(today.date);return false;}
async function requireSession(){const {data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session){location.replace("auth-login.html");throw new Error("No session");}user=data.session.user;$("status").textContent=`${user.email||user.id} — ${user.id}`;}
async function loadPatients(){const {data,error}=await supabase.from("patients").select("id,display_name,timezone,created_at").order("created_at",{ascending:false});if(error)throw error;$("patients").innerHTML="";(data||[]).forEach(p=>{const li=document.createElement("li"),b=document.createElement("button");b.textContent=`${p.display_name} (${p.timezone})`;b.onclick=()=>selectPatient(p);li.appendChild(b);$("patients").appendChild(li);});if(selectedPatient&&!data?.some(p=>p.id===selectedPatient.id)){selectedPatient=null;selectedRole=null;}return data||[];}
async function selectPatient(p){selectedPatient=p;$("selected").textContent=`${p.display_name} — ${p.timezone}`;const {data,error}=await supabase.from("patient_memberships").select("role,status").eq("patient_id",p.id).eq("user_id",user.id).eq("status","accepted").maybeSingle();if(error)throw error;selectedRole=data?.role||null;$("role").textContent=`Role: ${selectedRole||"none"}`;await Promise.all([loadMedications(),loadToday(),loadHistory()]);}
async function loadMedications(){if(!selectedPatient)return;const {data,error}=await supabase.from("medications").select("id,name,content_value,content_unit,intake_quantity,intake_unit,active,cancelled,created_at").eq("patient_id",selectedPatient.id).order("created_at",{ascending:false});if(error)throw error;$("medications").innerHTML=(data||[]).map(m=>`<li>${esc(m.name)} — ${esc(m.content_value)} ${esc(m.content_unit)} / ${esc(m.intake_quantity)} ${esc(m.intake_unit)}${m.cancelled?" — cancelled":""}</li>`).join("")||"<li>No medications</li>";}
async function loadToday(){if(!selectedPatient)return;const today=patientToday();const {data:meds,error:me}=await supabase.from("medications").select("id,name").eq("patient_id",selectedPatient.id).eq("active",true).eq("cancelled",false);if(me)throw me;const {data:schedules,error:se}=await supabase.from("medication_schedules").select("id,medication_id,schedule_type,weekdays,explicit_dates,start_date,end_date").eq("patient_id",selectedPatient.id);if(se)throw se;const activeSchedules=(schedules||[]).filter(s=>scheduleRunsToday(s,today));const ids=activeSchedules.map(x=>x.id);let times=[];if(ids.length){const r=await supabase.from("medication_schedule_times").select("id,schedule_id,time_of_day").eq("patient_id",selectedPatient.id).in("schedule_id",ids).order("time_of_day");if(r.error)throw r.error;times=r.data||[];}const medById=new Map((meds||[]).map(m=>[m.id,m]));const schById=new Map(activeSchedules.map(s=>[s.id,s]));$("today").innerHTML="";let rendered=0;for(const t of times){const s=schById.get(t.schedule_id),m=s&&medById.get(s.medication_id);if(!m)continue;const div=document.createElement("div");div.className="slot";div.innerHTML=`<strong>${esc(String(t.time_of_day).slice(0,5))}</strong> — ${esc(m.name)} `;const b=document.createElement("button");b.textContent="Taken now";b.onclick=()=>recordIntake(m.id,t.time_of_day,today);div.appendChild(b);$("today").appendChild(div);rendered++;}if(!rendered)$("today").textContent="No active schedule times today.";}
async function recordIntake(medicationId,timeOfDay,today=patientToday()){if(!selectedPatient)return;const now=new Date();let plannedAt;try{plannedAt=zonedLocalToIso(today.date,timeOfDay,today.timeZone);}catch(e){fail(`Invalid patient timezone: ${selectedPatient.timezone}`);return;}const {error}=await supabase.from("intake_events").insert({patient_id:selectedPatient.id,medication_id:medicationId,event_type:"taken",planned_at:plannedAt,actual_at:now.toISOString(),status:"taken"});if(error){fail(error);return;}await loadHistory();}
async function loadHistory(){if(!selectedPatient)return;const {data,error}=await supabase.from("intake_events").select("id,event_type,planned_at,actual_at,status,actor_user_id,created_at,medication_id").eq("patient_id",selectedPatient.id).order("created_at",{ascending:false}).limit(100);if(error)throw error;$("history").innerHTML=(data||[]).map(r=>`<div>${esc(r.event_type)} — ${esc(new Date(r.actual_at).toLocaleString())} — ${esc(r.status||"")} — actor ${esc(r.actor_user_id)}</div>`).join("")||"No history.";}
$("createPatient").onclick=async()=>{fail("");const name=$("patientName").value.trim(),tz=$("patientTz").value.trim()||"UTC";if(!name)return fail("Patient name is required");try{zoneParts(new Date(),tz);}catch{return fail("Timezone must be a valid IANA timezone, for example Europe/London or UTC");}const {data,error}=await supabase.rpc("create_patient",{patient_name:name,patient_timezone:tz});if(error)return fail(error);$("patientName").value="";await loadPatients();const {data:p}=await supabase.from("patients").select("id,display_name,timezone,created_at").eq("id",data).single();if(p)await selectPatient(p);};
$("addMedication").onclick=async()=>{fail("");if(!selectedPatient)return fail("Select a patient first");const name=$("medName").value.trim(),times=$("medTimes").value.split(",").map(x=>x.trim()).filter(Boolean);if(!name||!times.length)return fail("Medication name and at least one HH:MM time are required");if(!times.every(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))return fail("Times must be HH:MM");const today=patientToday(),start=today.date;const endDate=new Date(`${start}T00:00:00Z`);endDate.setUTCDate(endDate.getUTCDate()+365);const end=endDate.toISOString().slice(0,10);const medication_data={name,manufacturer:"",contentValue:$("medValue").value||"0",contentUnit:$("medUnit").value||"mg",contentUnitOther:"",intakeQuantity:$("medQty").value||"1",intakeUnit:$("medIntakeUnit").value||"tablet",intakeUnitOther:"",details:name,order:"0",active:"true"};const schedule_data={scheduleType:"daily",weekdays:[],explicitDates:[],startDate:start,endDate:end};const {error}=await supabase.rpc("create_medication_with_schedule",{target_patient_id:selectedPatient.id,medication_data,schedule_data,schedule_times:times.map(x=>`${x}:00`)});if(error)return fail(error);$("medName").value="";$("medTimes").value="";await Promise.all([loadMedications(),loadToday(),loadHistory()]);};
$("logout").onclick=async()=>{await supabase.auth.signOut();location.replace("auth-login.html");};try{await requireSession();const ps=await loadPatients();if(ps.length)await selectPatient(ps[0]);}catch(e){fail(e);}
</script></body></html>
