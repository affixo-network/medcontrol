<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Медконтроль — E2E</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}.card{border:1px solid #ddd;border-radius:12px;padding:18px}.row{padding:10px 0;border-bottom:1px solid #eee}.ok{font-weight:700}.bad{font-weight:700}button{padding:10px 14px;font:inherit}</style></head><body><h1>Медконтроль — проверка связи</h1><div class="card"><div class="row" id="auth">Авторизация: проверка…</div><div class="row" id="patient">Пациент: ожидание</div><div class="row" id="write">Запись: ожидание</div><div class="row" id="read">Чтение: ожидание</div><p id="error"></p><button id="retry">Проверить снова</button></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./supabase-config.js';const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const set=(id,ok,text)=>{const e=document.getElementById(id);e.textContent=text;e.className='row '+(ok?'ok':'bad')};async function run(){document.getElementById('error').textContent='';const{data:{session},error:se}=await sb.auth.getSession();if(se||!session){set('auth',false,'Авторизация: НЕТ');set('patient',false,'Пациент: —');set('write',false,'Запись: —');set('read',false,'Чтение: —');document.getElementById('error').textContent=se?.message||'Нет активной Supabase-сессии. Сначала войдите через Login.';return}set('auth',true,'Авторизация: OK');const{data,error}=await sb.rpc('mc_e2e_roundtrip');if(error){document.getElementById('error').textContent=error.message;set('patient',false,'Пациент: ERROR');set('write',false,'Запись: ERROR');set('read',false,'Чтение: ERROR');return}set('patient',!!data.patient_ok,'Пациент: '+(data.patient_ok?'OK':'FAIL'));set('write',!!data.write_ok,'Запись: '+(data.write_ok?'OK':'FAIL'));set('read',!!data.read_ok,'Чтение: '+(data.read_ok?'OK':'FAIL'));if(data.error)document.getElementById('error').textContent=data.error}document.getElementById('retry').onclick=run;run();</script></body></html>
