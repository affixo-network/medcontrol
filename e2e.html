<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Медконтроль — E2E</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}.card{border:1px solid #ddd;border-radius:12px;padding:18px}.row{padding:10px 0;border-bottom:1px solid #eee}.ok{font-weight:700}.bad{font-weight:700}button{padding:10px 14px;font:inherit}</style></head><body><h1>Медконтроль — проверка связи</h1><div class="card"><div class="row" id="auth">Авторизация: проверка…</div><div class="row" id="patient">Пациент: ожидание</div><div class="row" id="write">Запись: ожидание</div><div class="row" id="read">Чтение: ожидание</div><div class="row" id="live">Live bridge: ожидание</div><p id="error"></p><button id="retry">Проверить снова</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-live-bridge.js"></script><script>const set=(id,ok,text)=>{const e=document.getElementById(id);e.textContent=text;e.className='row '+(ok?'ok':'bad')};async function run(){document.getElementById('error').textContent='';try{const b=window.MedControlSupabaseBridge;const{data:{session},error:se}=await b.client().auth.getSession();if(se||!session){set('auth',false,'Авторизация: НЕТ');set('patient',false,'Пациент: —');set('write',false,'Запись: —');set('read',false,'Чтение: —');set('live',false,'Live bridge: —');document.getElementById('error').textContent=se?.message||'Нет активной Supabase-сессии.';return}set('auth',true,'Авторизация: OK');const data=await b.probe();set('patient',!!data.patient_ok,'Пациент: '+(data.patient_ok?'OK':'FAIL'));set('write',!!data.write_ok,'Запись: '+(data.write_ok?'OK':'FAIL'));set('read',!!data.read_ok,'Чтение: '+(data.read_ok?'OK':'FAIL'));const seed={settings:{timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',interfaceLanguage:'ru'},medications:[{id:'__live_e2e_med__',name:'E2E',cancelled:false}],intakeLogs:[]};await b.queue(seed);await b.flush();const loaded=await b.pull(seed);const live=!!loaded.remote&&loaded.state.medications.some(m=>String(m.id)==='__live_e2e_med__');set('live',live,'Live bridge: '+(live?'OK':'FAIL'));if(data.error)document.getElementById('error').textContent=data.error}catch(e){document.getElementById('error').textContent=e.message||String(e);set('live',false,'Live bridge: ERROR')}}document.getElementById('retry').onclick=run;run();</script></body></html>
