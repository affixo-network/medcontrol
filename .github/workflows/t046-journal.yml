name: T-046 Encrypted Journal Verification
on:
  push:
    branches: [modular-3.000]
    paths:
      - 'js/modular3-t046-journal.js'
      - 'tests/t046-journal.spec.js'
      - 'playwright.t046-journal.config.cjs'
      - '.github/workflows/t046-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify isolated encrypted event journal
        run: npx playwright test --config=playwright.t046-journal.config.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: t046-journal-traces
          path: test-results/
          retention-days: 7
