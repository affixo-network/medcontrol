name: T-046 Encrypted Event Sizing
on:
  push:
    branches: [modular-3.000]
    paths:
      - 'tests/t046-event-sizing.spec.js'
      - 'playwright.t046-sizing.config.cjs'
      - '.github/workflows/t046-event-sizing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sizing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Measure real AES-GCM encrypted event records
        run: npx playwright test --config=playwright.t046-sizing.config.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: t046-sizing-traces
          path: test-results/
          retention-days: 7
