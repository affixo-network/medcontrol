name: MedControl Staging Pages

on:
  push:
    branches: [staging-supabase-sync]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medcontrol-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated staging site
        run: |
          mkdir -p _site
          cp index.html auth-login.html app.html settings.html supabase-config.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4
