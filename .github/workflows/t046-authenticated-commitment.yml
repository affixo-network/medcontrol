name: T-046 Authenticated Commitment
on:
  push:
    branches: [modular-3.000]
    paths:
      - 'js/modular3-t046-authenticated-commitment.js'
      - 'js/modular3-t046-authenticated-gateway.js'
      - 'js/modular3-t046-authenticated-atomic.js'
      - 'tests/t046-authenticated-atomic.spec.js'
      - 'tests/t046-authenticated-abort.spec.js'
      - 'tests/t046-authenticated-reopen.spec.js'
      - 'tests/t046-authenticated-corruption.spec.js'
      - 'tests/t046-authenticated-restore.spec.js'
      - 'js/modular3-t046-replica-protocol.js'
      - 'tests/t046-replica-protocol.spec.js'
      - 'tests/t046-replica-interruption.spec.js'
      - 'tests/t046-replica-resume.spec.js'
      - 'tests/t046-replica-restart.spec.js'
      - 'js/modular3-t046-replica-queue.js'
      - 'tests/t046-replica-queue.spec.js'
      - 'js/modular3-t046-replica-coordinator.js'
      - 'tests/t046-replica-coordinator.spec.js'
      - 'js/modular3-t046-replica-drain.js'
      - 'tests/t046-replica-drain.spec.js'
      - 'js/modular3-t046-replica-retry.js'
      - 'tests/t046-replica-retry.spec.js'
      - 'tests/t046-replica-cross-tab.spec.js'
      - 'tests/t046-replica-backoff.spec.js'
      - 'tests/t046-replica-restart-queue.spec.js'
      - 'tests/t046-replica-process-restart.spec.js'
      - 'tests/t046-authenticated-gateway.spec.js'
      - 'tests/t046-authenticated-commitment.spec.js'
      - 'playwright.t046-auth.config.cjs'
      - '.github/workflows/t046-authenticated-commitment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify keyed commitments
        run: npx playwright test --config=playwright.t046-auth.config.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: t046-auth-traces
          path: test-results/
          retention-days: 7
