name: Modular 3 Browser E2E
on:
  push:
    branches: [modular-2.000]
    paths:
      - 'js/auth-guard.js'
      - 'js/modular3-script-loader.js'
      - 'input.html'
      - 'action.html'
      - 'dashboard.html'
      - 'archive.html'
      - 'tests/modular3-browser.spec.js'
      - 'tests/modular3-real-modules.spec.js'
      - 'tests/modular3-deep-logic.spec.js'
      - 'tests/modular3-ui-actions.spec.js'
      - 'tests/modular3-cloud-recovery.spec.js'
      - 'tests/modular3-offline-proof.spec.js'
      - 'tests/modular3-offline-proof.html'
      - 'tests/modular3-offline-sw.js'
      - 'tests/modular3-offline-access.spec.js'
      - 'tests/modular3-offline-access.html'
      - 'tests/modular3-offline-auth.js'
      - 'tests/modular3-offline-access.js'
      - 'tests/modular3-offline-vault.js'
      - 'tests/modular3-offline-vault.spec.js'
      - 'tests/modular3-offline-storage-adapter.js'
      - 'tests/modular3-offline-adapter.spec.js'
      - 'tests/modular3-offline-real-sections.spec.js'
      - 'tests/modular3-offline-restart-history.spec.js'
      - 'tests/modular3-offline-encrypted-bridge.js'
      - 'tests/modular3-offline-encrypted-bridge.spec.js'
      - 'tests/modular3-offline-functional.spec.js'
      - 'tests/modular3-offline-archive.spec.js'
      - 'tests/modular3-offline-course-engine.js'
      - 'js/schedule.js'
      - 'js/temporal-change-guard.js'
      - 'tests/modular3-offline-access.js'
      - 'tests/modular3-offline-access.html'
      - 'playwright.modular3.config.cjs'
      - '.github/workflows/modular3-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Run isolated browser tests
        run: npx playwright test --config=playwright.modular3.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: modular3-browser-traces
          path: test-results/
          retention-days: 7
