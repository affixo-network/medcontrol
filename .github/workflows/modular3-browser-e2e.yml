      - 'tests/modular3-real-ui-course-archive.spec.js'
      - 'tests/modular3-real-ui-volume.spec.js'
      - 'tests/modular3-storage-faults.spec.js'
      - 'tests/modular3-offline-interrupted-checkpoint.spec.js'
      - 'tests/modular3-integration-rehearsal.spec.js'
      - 'tests/modular3-preview-migration.js'
      - 'tests/modular3-preview-migration.spec.js'
      - 'tests/modular3-real-module-bridge.js'
      - 'tests/modular3-real-module-bridge.spec.js'
      - 'tests/modular3-real-pages-vault-preview.spec.js'
      - 'tests/modular3-encrypted-concurrency.spec.js'
      - 'tests/modular3-real-page-readonly-adapter.js'
      - 'tests/modular3-real-page-readonly.spec.js'
      - 'tests/modular3-real-page-write-gate.js'
      - 'tests/modular3-real-page-write-gate.spec.js'
      - 'tests/modular3-real-page-checkpoint-sequence.spec.js'
      - 'tests/modular3-real-page-transaction.js'
      - 'tests/modular3-real-page-transaction.spec.js'
      - 'tests/modular3-real-action-encrypted-preview.js'
      - 'tests/modular3-real-action-encrypted-preview.spec.js'
      - 'tests/modular3-real-action-encrypted-preview.js'
      - 'tests/modular3-real-transaction-offline-restart.spec.js'
      - 'tests/modular3-offline-course-engine.js'
      - 'js/schedule.js'
      - 'js/temporal-change-guard.js'
      - 'tests/modular3-offline-access.js'
      - 'tests/modular3-offline-access.html'
      - 'playwright.modular3.config.cjs'
      - '.github/workflows/modular3-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Run isolated browser tests
        run: npx playwright test --config=playwright.modular3.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: modular3-browser-traces
          path: test-results/
          retention-days: 7

  preview-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Test deployed preview with synthetic isolated browser storage
        env:
          MEDCONTROL_TEST_BASE_URL: https://medcontrol-82nwj45jl-vahans-projects-daac8e43.vercel.app
        run: npx playwright test tests/modular3-migration-ui-confirmation.spec.js --config=playwright.modular3.config.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: modular3-preview-traces
          path: test-results/
          retention-days: 7
