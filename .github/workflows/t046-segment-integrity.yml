name: T-046 Segment Integrity
on:
  push:
    branches: [modular-3.000]
    paths:
      - 'js/modular3-t046-segment-codec.js'
      - 'tests/t046-segment-codec.spec.js'
      - 'playwright.t046-segment.config.cjs'
      - '.github/workflows/t046-segment-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  segment-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Test segment and manifest integrity
        run: npx playwright test --config=playwright.t046-segment.config.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: t046-segment-integrity-traces
          path: test-results/
          retention-days: 7
