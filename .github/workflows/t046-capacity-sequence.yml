name: T-046 Capacity 50M then 500M
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t046-capacity-sequence
  cancel-in-progress: false
jobs:
  capacity-50m:
    runs-on: [self-hosted, Windows, X64, t046-capacity]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows host and free disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          npm --version
          $drive = (Get-Location).Drive.Name
          $disk = Get-PSDrive -Name $drive
          Write-Host "Available GB:" ([math]::Round($disk.Free / 1GB, 2))
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Installed physical RAM bytes:" (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          if ($disk.Free -lt 20GB) { throw 'At least 20 GB free is required for initial capacity testing' }
      - name: Install dependencies
        run: npm install --no-save --no-package-lock @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run 50 million synthetic events
        env:
          T046_EVENT_COUNT: '50000000'
          T046_CAPACITY_APPROVED: 'YES'
        run: npx playwright test --config=playwright.t046-capacity.config.cjs --reporter=line
  capacity-500m:
    needs: capacity-50m
    runs-on: [self-hosted, Windows, X64, t046-capacity]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows host and free disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = (Get-Location).Drive.Name
          $disk = Get-PSDrive -Name $drive
          Write-Host "Available GB:" ([math]::Round($disk.Free / 1GB, 2))
          if ($disk.Free -lt 100GB) { throw '500M test requires at least 100 GB free; no writes attempted' }
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run 500 million synthetic events
        env:
          T046_EVENT_COUNT: '500000000'
          T046_CAPACITY_APPROVED: 'YES'
        run: npx playwright test --config=playwright.t046-capacity.config.cjs --reporter=line
