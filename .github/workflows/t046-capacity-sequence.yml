name: T-046 Capacity 50M then 500M
on:
  workflow_dispatch:
  push:
    branches: [modular-3.000]
    paths:
      - '.github/workflows/t046-capacity-sequence.yml'
permissions:
  contents: read
concurrency:
  group: t046-capacity-sequence
  cancel-in-progress: false
jobs:
  capacity-50m:
    # A persistent dedicated SSD runner is required: hosted ephemeral runners
    # cannot certify large persistent browser storage or a specific 8 GB PC.
    runs-on: [self-hosted, linux, x64, t046-capacity]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated runner resources
        shell: bash
        run: |
          set -eu
          command -v node
          command -v python3
          command -v npx
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 104857600
          free -h
          df -h .
      - name: Run 50 million synthetic events
        env:
          T046_EVENT_COUNT: '50000000'
          T046_CAPACITY_APPROVED: 'YES'
        run: npx playwright test --config=playwright.t046-capacity.config.cjs --reporter=line
  capacity-500m:
    needs: capacity-50m
    runs-on: [self-hosted, linux, x64, t046-capacity]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated runner resources
        shell: bash
        run: |
          set -eu
          command -v node
          command -v python3
          command -v npx
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 104857600
          free -h
          df -h .
      - name: Run 500 million synthetic events
        env:
          T046_EVENT_COUNT: '500000000'
          T046_CAPACITY_APPROVED: 'YES'
        run: npx playwright test --config=playwright.t046-capacity.config.cjs --reporter=line
