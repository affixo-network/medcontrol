name: Modular-3 Public Catalog Loader Tests
on:
  push:
    branches: [modular-3.000]
    paths:
      - 'js/modular3-public-catalog-loader.js'
      - 'js/modular3-legacy-locale-adapter.js'
      - 'js/modular3-locale-preparation.js'
      - 'js/language.js'
      - 'scripts/localization/test-public-catalog-loader.cjs'
      - 'scripts/localization/test-legacy-locale-adapter.cjs'
      - 'scripts/localization/test-real-legacy-catalog.cjs'
      - 'scripts/localization/test-locale-preparation.cjs'
      - 'scripts/localization/test-language-registration.cjs'
      - 'locales/source-ru.json'
      - 'locales/catalogs/en.json'
      - '.github/workflows/modular3-public-catalog-loader-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-loader-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run isolated catalog validation tests
        run: node --test scripts/localization/test-public-catalog-loader.cjs scripts/localization/test-legacy-locale-adapter.cjs scripts/localization/test-real-legacy-catalog.cjs scripts/localization/test-locale-preparation.cjs scripts/localization/test-language-registration.cjs
