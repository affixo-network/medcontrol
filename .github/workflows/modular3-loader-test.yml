name: Modular 3 Loader Tests
on:
  push:
    branches: [modular-2.000]
    paths:
      - 'js/modular3-script-loader.js'
      - 'js/auth-guard.js'
      - 'tests/modular3-script-loader.test.js'
      - 'tests/modular3-auth-guard.integration.test.js'
      - 'tests/modular3-offline-readiness.cjs'
      - 'tests/modular3-offline-security.test.cjs'
      - 'tests/modular3-offline-release-gate.test.cjs'
      - '.github/workflows/modular3-loader-test.yml'
  workflow_dispatch:
jobs:
  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/modular3-script-loader.js
          node --check js/auth-guard.js
      - name: Audit offline readiness without modifying production
        run: node tests/modular3-offline-readiness.cjs
      - name: Run loader and auth integration tests
        run: node --test tests/modular3-script-loader.test.js tests/modular3-auth-guard.integration.test.js tests/modular3-offline-security.test.cjs tests/modular3-offline-release-gate.test.cjs
