name: Modular 3 Loader Tests
on:
  push:
    branches: [modular-2.000]
    paths:
      - 'js/modular3-script-loader.js'
      - 'tests/modular3-script-loader.test.js'
      - '.github/workflows/modular3-loader-test.yml'
  workflow_dispatch:
jobs:
  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check loader syntax
        run: node --check js/modular3-script-loader.js
      - name: Run isolated loader tests
        run: node --test tests/modular3-script-loader.test.js
