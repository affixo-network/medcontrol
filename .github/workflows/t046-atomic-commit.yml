name: T-046 Atomic Commit Trial
on:
  push:
    branches: [modular-3.000]
    paths:
      - 'js/modular3-t046-atomic-prototype.js'
      - 'js/modular3-t046-segment-codec.js'
      - 'tests/t046-atomic-prototype.spec.js'
      - 'playwright.t046-atomic.config.cjs'
      - '.github/workflows/t046-atomic-commit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify isolated atomic commits
        run: npx playwright test --config=playwright.t046-atomic.config.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: t046-atomic-traces
          path: test-results/
          retention-days: 7
