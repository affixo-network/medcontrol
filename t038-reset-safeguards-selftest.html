<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>MedControl T-038 reset safeguards — source regression</title>
<pre id="result">RUNNING</pre>
<script>
(async function(){
 const output=document.getElementById('result'),results=[];
 const check=(name,ok)=>results.push({name,ok:!!ok});
 try{
  const [cloud,reset]=await Promise.all(['js/cloud-snapshot.js','js/archive-reset-policy.js'].map(async path=>{
   const response=await fetch(path,{cache:'no-store'});
   if(!response.ok)throw Error(path+': HTTP '+response.status);
   return response.text();
  }));
  check('Cloud snapshot creation blocked during reset',/async function createCloudSnapshot\(options=\{\}\)\s*\{\s*if\(resetSuspended\)return/.test(cloud));
  check('Cloud snapshot suspension rechecked immediately before insert',/if\(resetSuspended\)return \{ok:false,skipped:true,reason:'medical_reset_in_progress'\};\s*const \{data,error\}=await supabase\.from\(TABLE\)\.insert\(/.test(cloud));
  check('Cloud snapshot reads blocked during reset',/async function getLatestCloudSnapshot\(\)\s*\{if\(resetSuspended\)return/.test(cloud));
  check('Cloud restoration blocked during reset',/async function restoreLatestCloudSnapshot\(options=\{\}\)\s*\{if\(resetSuspended\)return/.test(cloud));
  check('Queued snapshot failure cannot requeue while reset suspended',/if\(!resetSuspended\)retryState=captured/.test(cloud));
  check('Protected reset waits for cloud suspension',/await cloudSnapshots\.suspendForReset\(\)/.test(reset));
  check('Protected reset clears medical history',/state\.intakeLogs=\[\];state\.intakeCorrections=\[\];state\.archiveHistory=\[\];state\.archivedCourses=\[\]/.test(reset));
  check('Protected reset resumes cloud on failure',/if\(!resetCommitted\)cloudSnapshots\?\.resumeAfterResetFailure\?\.\(\)/.test(reset));
  check('Full reset does not preserve a plaintext local backup',!/preserveCycleResetBackup\(oldState,'manual_cycle_reset'\)/.test(reset));
  check('Full reset does not create an old-state cloud snapshot',!/await window\.medcontrolCloudSnapshot\.create\(\{state:oldState\}\)/.test(reset));
  check('Owner-scoped snapshot deduplication read',/select\('id,state,created_at'\)\.eq\('owner_user_id',user\.id\)/.test(cloud));
  check('Owner-scoped snapshot restoration read',/select\('id,state,state_version,source_version,created_at'\)\.eq\('owner_user_id',window\.medcontrolSupabaseUser\.id\)/.test(cloud));
  check('Owner-scoped read-only reset inventory',/select\('id',\{count:'exact',head:true\}\)\.eq\('owner_user_id',user\.id\)/.test(cloud));
  check('Protected reset fails closed without inventory verifier',/\}else\{\s*throw Error\('Проверка облачных резервных копий недоступна\. Сброс отменён\.'\)/.test(reset));
  check('Protected reset rejects remaining cloud copies',/if\(!inventory\.empty\)throw Error/.test(reset));
  check('Protected reset requires snapshot suspension capability',/if\(!cloudSnapshots\?\.suspendForReset\)throw Error/.test(reset));
  check('Snapshot suspension happens before inventory check',/await cloudSnapshots\.suspendForReset\(\);[\s\S]*?verifyOwnSnapshotInventoryForReset/.test(reset));
  check('Cloud inventory failure aborts protected reset',/if\(!inventory\.ok\)throw Error/.test(reset));
  check('Cloud latest read checks suspension after network await',/if\(error\)return \{ok:false,reason:'snapshot_read_failed',error\};if\(resetSuspended\)return/.test(cloud));
  check('Cloud restore checks suspension after latest lookup',/const result=await getLatestCloudSnapshot\(\);if\(resetSuspended\)return/.test(cloud));
  check('Cloud restore checks suspension before local write',/const key=\`\$\{STORAGE_KEY\}_before_cloud_restore_\$\{Date\.now\(\)\}\`;if\(resetSuspended\)return/.test(cloud));
  check('Inventory rejects reset suspension lost after await',/if\(!resetSuspended\)return \{ok:false,reason:'reset_no_longer_suspended'\}/.test(cloud));
  check('Inventory rejects unavailable or invalid count',/if\(!Number\.isSafeInteger\(count\)\|\|count<0\)return \{ok:false,reason:'snapshot_inventory_count_unavailable'\}/.test(cloud));
  check('Inventory rejects changed authenticated owner',/window\.medcontrolSupabase!==supabase\|\|window\.medcontrolSupabaseUser\?\.id!==user\.id/.test(cloud));
  check('No password removal in reset source',!/removeItem\(['"]medcontrol_modular3_local_credential_v1/.test(reset));
 }catch(e){check('Source fetch: '+e.message,false);}
 const pass=results.every(x=>x.ok)&&results.length===25;
 output.textContent=(pass?'PASS':'FAIL')+' — T-038 source regression (not E2E)\n\n'+results.map((r,i)=>(i+1)+'. '+r.name+': '+(r.ok?'PASS':'FAIL')).join('\n');
})();
</script></html>
