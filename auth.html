<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedControl — Вход</title><style>body{font-family:Arial,sans-serif;max-width:520px;margin:48px auto;padding:0 16px}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:7px 0}#status{white-space:pre-wrap}</style></head><body><h1>MedControl — вход</h1><p>Введите подтверждённый email MedControl. На него будет отправлена одноразовая ссылка входа.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><button id="send">Отправить ссылку входа</button><p id="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-live-bridge.js"></script><script>(async()=>{const b=window.MedControlSupabaseBridge,c=b.client(),status=document.getElementById('status');const {data}=await c.auth.getSession();if(data?.session){status.textContent='Вход выполнен. Переход в MedControl…';location.replace('input.html');return}document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){status.textContent='Введите email.';return}status.textContent='Отправка…';const {error}=await c.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:new URL('auth.html',location.href).href}});status.textContent=error?'Ошибка: '+error.message:'Ссылка отправлена. Откройте письмо в этом браузере.'};c.auth.onAuthStateChange((event,session)=>{if(session){status.textContent='Вход выполнен. Переход в MedControl…';setTimeout(()=>location.replace('input.html'),50)}})})();</script></body></html>
