<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedControl — Вход</title><style>body{font-family:Arial,sans-serif;max-width:520px;margin:48px auto;padding:0 16px}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:7px 0}</style></head><body><h1>MedControl — вход</h1><input id="email" type="email" placeholder="Email"><button id="send">Отправить ссылку входа</button><p id="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-live-bridge.js"></script><script>(async()=>{const c=MedControlSupabaseBridge.client(),s=document.getElementById('status');const {data}=await c.auth.getSession();if(data?.session){location.replace('input.html');return}send.onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return;const {error}=await c.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:new URL('auth.html',location.href).href}});s.textContent=error?'Ошибка: '+error.message:'Ссылка отправлена.'};c.auth.onAuthStateChange((e,session)=>{if(session)location.replace('input.html')})})();</script></body></html>
