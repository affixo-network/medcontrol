<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>MedControl V2 — Force Majeure Self-Test</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px}.card{border:1px solid #ccc;border-radius:12px;padding:18px}.pass{border-color:#17803d}.fail{border-color:#b42318}pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}</style></head><body><h1>MedControl Version 2 — комплексный force-majeure self-test</h1><p>Тест изолированный: реальные MedControl storage и Supabase-сессия не используются.</p><div id="status" class="card">Запуск…</div><pre id="details"></pre><script>(async()=>{const out=[];let all=true;const add=(n,v)=>{out.push(`${n} = ${v}`);all=all&&v};try{const r=await fetch('js/auth-guard.js?v=force-majeure-selftest');if(!r.ok)throw new Error('auth-guard HTTP '+r.status);const src=await r.text();add('1. getSession error не вызывает signOut',/if\(sessionError\)\{[\s\S]*?showStartupError[\s\S]*?return;[\s\S]*?\}\s*if\(!sessionData\?\.session\)/.test(src)&&!/if\(sessionError\)[\s\S]{0,500}signOut/.test(src));add('2. getUser error не вызывает signOut',/if\(userError\)\{[\s\S]*?showStartupError[\s\S]*?return;[\s\S]*?\}\s*if\(!userData\?\.user\)/.test(src));add('3. signOut остаётся только для подтверждённого invalid user',/if\(!userData\?\.user\)\{\s*await supabase\.auth\.signOut/.test(src));const storagePos=src.indexOf("'js/storage.js");const authPos=src.indexOf('await supabase.auth.getUser()');const startPos=src.indexOf('await startPage()');add('4. Рабочие скрипты запускаются только после getUser',authPos>=0&&startPos>authPos&&storagePos>=0);const sr=await fetch('js/storage.js?v=force-majeure-selftest');if(!sr.ok)throw new Error('storage HTTP '+sr.status);const ss=await sr.text();add('5. Pre-upgrade snapshot присутствует',ss.includes('_pre_modular_2_upgrade_backup')&&ss.includes('preserveV2PreUpgradeSnapshot(raw)'));add('6. Ошибка snapshot останавливает запуск',ss.includes("'pre_upgrade_backup_failed'")&&ss.includes('throw storageRecoveryError'));add('7. Ошибка чтения storage останавливает запуск',ss.includes("'storage_read_failed'"));add('8. Ошибка записи initial state останавливает запуск',ss.includes("'initial_state_save_failed'"));document.getElementById('status').className='card '+(all?'pass':'fail');document.getElementById('status').textContent=all?'PASS — комплексная статическая проверка пройдена':'FAIL — обнаружено отклонение';document.getElementById('details').textContent=out.join('\n');}catch(e){document.getElementById('status').className='card fail';document.getElementById('status').textContent='FAIL — self-test не выполнен';document.getElementById('details').textContent=String(e?.stack||e);}})();</script></body></html>
