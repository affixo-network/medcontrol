    body::after {
      content: "VERSION 2 · modular-2.000";
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2147483647;
      padding: 12px 18px;
      border: 2px solid #111827;
      border-radius: 12px;
      background: #111827;
      color: #ffffff;
      font: 700 20px/1.2 Arial, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.22);
      pointer-events: none;
      letter-spacing: .2px;
    }
    @media (max-width: 700px) {
      body::after {

    }

<body>
  <div id="app">Загрузка MedControl…</div>
  <script>
    (function(){
      function show(message){
        var app=document.getElementById('app');
        if(!app)return;
        app.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;white-space:pre-wrap"><h1>Ошибка запуска MedControl</h1><p>'+String(message).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</p></div>';
      }
      window.__medcontrolShowStartupError=show;
      window.addEventListener('error',function(e){show((e.message||'JavaScript error')+'\n'+(e.filename||'')+':'+(e.lineno||'')+':'+(e.colno||''));});
      window.addEventListener('unhandledrejection',function(e){show('Promise error: '+(e.reason&&e.reason.stack?e.reason.stack:e.reason));});
    })();
  </script>
  <script src="js/translations.js"></script>

    }
