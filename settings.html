<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedControl — Staging Settings</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:16px 0}button,a{font:inherit;padding:8px 12px}.muted{color:#666}</style></head>
<body><p><a href="/app.html">← App</a></p><h1>Settings</h1><div class="card"><h2>Account</h2><p id="email">—</p><p id="uid" class="muted">—</p></div><div class="card"><h2>Security model</h2><p>Patient authorization is controlled by accepted patient membership and database RLS. Identity is the authenticated user UUID.</p></div><button id="logout">Logout</button><p id="status" class="muted"></p>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./supabase-config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data,error}=await supabase.auth.getSession();if(error||!data.session){location.replace("/auth-login.html");}else{document.getElementById("email").textContent=data.session.user.email||"—";document.getElementById("uid").textContent=`User ID: ${data.session.user.id}`;}document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();location.replace("/auth-login.html");};
</script></body></html>
