<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedControl Protected</title><style>
:root{--fg:#111827;--muted:#6b7280;--bd:#e5e7eb;--bg:#f8fafc;--card:#fff;--accent:#111827}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1120px;padding:24px 16px 48px;font:15px/1.5 Arial,sans-serif;color:var(--fg);background:var(--bg)}
h1,h2,h3{margin:0 0 12px}h1{font-size:26px}h2{font-size:21px}h3{font-size:16px}
p{margin:0 0 12px}body>h1,body>p:first-of-type,#login,#workspace{background:var(--card)}
body>h1{border:1px solid var(--bd);border-bottom:0;border-radius:14px 14px 0 0;padding:20px 20px 0;margin:0}
body>p:first-of-type{border:1px solid var(--bd);border-top:0;border-radius:0 0 14px 14px;padding:4px 20px 18px;color:var(--muted);margin:0 0 16px}
#login,#workspace{border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--bd)}
button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px 11px;background:white;color:inherit}
button{cursor:pointer}button:hover:not(:disabled){background:#f1f5f9}button:disabled{opacity:.55;cursor:not-allowed}
button[data-tab][aria-current="page"]{background:var(--accent);color:white;border-color:var(--accent)}
label{display:block;margin:10px 0;font-weight:600}
label input{display:block;margin-top:5px;max-width:100%;font-weight:400}
label button{vertical-align:middle}
#screen form{border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0;background:#fff}
#screen article{padding:16px;margin:10px 0;border:1px solid var(--bd);border-radius:12px;background:#fff}
#screen article p{color:var(--muted)}
#screen article button{margin:4px 6px 4px 0}
#message{white-space:pre-wrap;color:#334155;padding:4px 8px}
@media(max-width:640px){body{padding:10px}#login,#workspace{padding:12px}nav{gap:4px}button{padding:7px}}

/* Original MedControl layout primitives reused in protected workspace. */

    :root{--fg:#111827;--muted:#6b7280;--bd:#e5e7eb;--bg:#f8fafc;--card:#ffffff;--soft:#f3f4f6;--ok:#ecfdf5;--warn:#fff7ed;--bad:#fef2f2}
    *{box-sizing:border-box} #screen{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45}
    .wrap{max-width:1380px;margin:0 auto;padding:20px 16px 48px}.topbar,.card{background:var(--card);border:1px solid var(--bd);border-radius:16px}
    .topbar{padding:14px;margin-bottom:16px}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav a,.nav button{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--fg);cursor:pointer;font:inherit}
    .nav .active{border-color:#111827;background:#111827;color:#fff}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-size:12px}
    .card{padding:18px;margin-bottom:16px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .muted{color:var(--muted)} h1,h2,h3{margin:0 0 12px} p{margin:0 0 12px} ul{margin:8px 0 0 18px;padding:0} li{margin:6px 0}
    table{width:100%;border-collapse:collapse} th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top} th{font-size:13px;background:#fafafa}
    .status{display:inline-flex;padding:4px 10px;border-radius:999px;border:1px solid var(--bd);font-size:12px}.expected{background:var(--warn)}.upcoming{background:#eff6ff}.overdue{background:var(--bad)}.success{background:var(--ok)}
    label{display:block;font-weight:bold;margin-bottom:6px} input,select,textarea,button{font:inherit} input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff}
    textarea{min-height:88px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1 / -1}.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.slot{padding:10px;border:1px solid var(--bd);border-radius:12px;background:#fff;margin-bottom:10px}
    dialog{border:1px solid var(--bd);border-radius:16px;padding:18px;max-width:820px;width:calc(100% - 24px)} .row-history-dialog{width:calc(100vw - 24px);max-width:none;box-sizing:border-box} dialog::backdrop{background:rgba(0,0,0,.3)} .right{text-align:right}
    .small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace}.help{padding:12px;border-radius:12px;background:#fafafa;border:1px solid var(--bd)}
    .structured-editor{padding:14px;border:1px solid var(--bd);border-radius:14px;background:#fafafa}.number-pickers,.date-picker-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.number-pickers>div{min-width:120px}.number-pickers select{min-width:110px}.field-caption{display:block;font-weight:bold;margin-bottom:6px}.choice-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.choice-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:#fff}.choice-chip button{padding:5px 9px}.empty-choice{color:var(--muted);padding:8px 0}.weekday-grid{display:grid;grid-template-columns:repeat(7,minmax(62px,1fr));gap:8px}.weekday-choice{margin:0;padding:10px;border:1px solid var(--bd);border-radius:12px;background:#fff;text-align:center;cursor:pointer}.weekday-choice input{width:auto;margin-right:6px}.active-choice input{width:auto}.date-picker-row input{max-width:280px}.confirm-table td:first-child{width:170px;font-weight:600;color:#444}.confirm-table tr:not(:last-child){border-bottom:1px solid #ececec}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
    @media(max-width:960px){.grid2,.grid3,.form-grid{grid-template-columns:1fr}}
  
#workspace .nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#workspace .nav button{width:auto}#workspace .nav button[aria-current='page']{background:#111827;color:#fff}#screen .wrap{padding:12px 0 28px}#screen .card{margin-bottom:16px}#screen .grid2,#screen .grid3{display:grid}#screen .meta{display:flex;flex-wrap:wrap}
</style></head>
<body><h1>MedControl — защищённый режим</h1><p>Отдельное хранилище. Действующие записи не изменяются.</p>
<div id="login"><label>Локальный пароль <input id="password" type="password" minlength="12"></label><button id="unlock">Войти</button><button id="recover" type="button">Восстановить доступ</button><button id="enroll">Создать хранилище</button><button id="inspect-migration" type="button">Проверить готовность переноса</button><button id="commit-migration" type="button">Перенести защищённую копию</button><label>Резервная копия MedControl (.json) <input id="legacy-backup" type="file" accept=".json,application/json"></label><button id="import-backup" type="button">Импортировать защищённую копию</button></div>
<div id="workspace" hidden><nav class="nav"><button data-tab="input">Ввод</button><button data-tab="action">Приём препаратов</button><button data-tab="dashboard">Табло</button><button data-tab="archive">Архив</button><button id="lock">Выйти</button></nav><main id="screen"></main></div><p id="message" role="status"></p>
<script src="/js/modular3-encrypted-vault.js"></script><script src="/js/modular3-offline-credential.js"></script><script src="/js/modular3-protected-session.js"></script><script src="/js/modular3-write-boundary.js"></script><script src="/js/modular3-protected-pages.js"></script><script src="/js/modular3-copy-migration.js"></script><script src="/js/modular3-protected-workspace.js"></script><script>
(function(){
 'use strict';
 const status=document.getElementById('message');
 if(!('serviceWorker' in navigator)||!('caches' in window)){
  status.textContent='Этот браузер не поддерживает автономную загрузку.';
  return;
 }
 window.addEventListener('load',async function(){
  try{
   const registration=await navigator.serviceWorker.register('/modular3-static-cache-sw.js',{scope:'/'});
   await navigator.serviceWorker.ready;
   const paths=['/modular3-protected.html','/js/modular3-encrypted-vault.js','/js/modular3-offline-credential.js','/js/modular3-protected-session.js','/js/modular3-write-boundary.js','/js/modular3-protected-pages.js','/js/modular3-copy-migration.js','/js/modular3-protected-workspace.js'];
   const cache=await caches.open('medcontrol-static-modular3-v5');
   let cached=await Promise.all(paths.map(path=>cache.match(path)));
   if(cached.some(item=>!item)){
    if(!navigator.onLine)throw Error('Не все автономные файлы доступны в кэше');
    const worker=registration.active||registration.waiting||registration.installing;
    if(!worker)throw Error('Service worker unavailable');
    const channel=new MessageChannel();
    const result=new Promise((resolve,reject)=>{
     const timeout=setTimeout(()=>reject(Error('Offline cache timeout')),12000);
     channel.port1.onmessage=e=>{clearTimeout(timeout);e.data?.ok?resolve():reject(Error(e.data?.error||'Offline cache failed'));};
    });
    worker.postMessage({type:'MEDCONTROL_CACHE_SHELL',paths},[channel.port2]);
    await result;
    cached=await Promise.all(paths.map(path=>cache.match(path)));
   }
   if(cached.some(item=>!item))throw Error('Offline files missing');
   if(!navigator.serviceWorker.controller){
    status.textContent='Автономные файлы подготовлены. Обновите страницу один раз при включённом интернете, затем проверяйте без сети.';
   }else if(!status.textContent){
    status.textContent='Автономные файлы подготовлены и проверены.';
   }
  }catch(error){
   status.textContent='Автономная загрузка не готова: '+error.message;
  }
 });
})();
</script></body></html>
