<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedControl Protected</title><style>body{font:16px system-ui;max-width:840px;margin:2rem auto;padding:1rem}button,input{font:inherit;padding:.5rem;margin:.3rem}label{display:block;margin:.5rem 0}article{padding:1rem;border-bottom:1px solid #aaa}nav{display:flex;flex-wrap:wrap}#message{white-space:pre-wrap}</style></head>
