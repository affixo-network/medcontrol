<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>MedControl V2 — Pre-upgrade Snapshot Self-Test</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px}.card{border:1px solid #ccc;border-radius:12px;padding:18px}.pass{border-color:#17803d}.fail{border-color:#b42318}pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}</style></head><body><h1>MedControl Version 2 — pre-upgrade snapshot self-test</h1><p>Тест использует искусственный storage и не затрагивает реальные данные браузера.</p><div id="status" class="card">Запуск…</div><pre id="details"></pre><script>(async function(){const PRIMARY='affixo_medcontrol_standard_v3';const BACKUP=PRIMARY+'_pre_modular_2_upgrade_backup';const MARKER=PRIMARY+'_pre_modular_2_upgrade_marker';const status=document.getElementById('status');const details=document.getElementById('details');function finish(ok,lines){status.className='card '+(ok?'pass':'fail');status.textContent=ok?'PASS — pre-upgrade snapshot подтверждён':'FAIL — pre-upgrade snapshot self-test не пройден';details.textContent=lines.join('\n');}function fakeStorage(initial={}){const map=new Map(Object.entries(initial));return{getItem:k=>map.has(k)?map.get(k):null,setItem:(k,v)=>map.set(k,String(v)),removeItem:k=>map.delete(k),dump:()=>Object.fromEntries(map.entries())};}function run(source,store){const body=source+`\nreturn (function(){let value=null,error=null;try{value=getState();}catch(e){error={code:e.code,message:e.message};}return {value,error,dump:localStorage.dump()};})();`;const fn=new Function('localStorage','window','navigator','Intl','TRANSLATIONS','makeDefaultState','inferCountryFromLocale',body);return fn(store,{alert:function(){}},{language:'ru-RU'},Intl,{en:{},ru:{}},undefined,function(){return 'Armenia';});}try{const r=await fetch('js/storage.js?v=pre-upgrade-snapshot-selftest');if(!r.ok)throw new Error('HTTP '+r.status);const source=await r.text();const v1State={settings:{interfaceLanguage:'ru',timezone:'Asia/Yerevan'},medications:[{id:'v1-med',name:'V1-SNAPSHOT'}],intakeLogs:[{id:'v1-log'}]};const v1Raw=JSON.stringify(v1State);const store=fakeStorage({[PRIMARY]:v1Raw});const first=run(source,store);const d1=first.dump;const backupCreated=d1[BACKUP]===v1Raw;const markerCreated=!!d1[MARKER];const primaryUnchanged=d1[PRIMARY]===v1Raw;store.setItem(PRIMARY,JSON.stringify({settings:{interfaceLanguage:'ru'},medications:[{id:'v2-med',name:'V2-CHANGED'}],intakeLogs:[]}));const second=run(source,store);const d2=second.dump;const backupNotOverwritten=d2[BACKUP]===v1Raw;let restoredOk=false;try{store.setItem(PRIMARY,d2[BACKUP]);restoredOk=JSON.parse(store.getItem(PRIMARY)).medications?.[0]?.id==='v1-med';}catch(_){}const lines=[`1. Первый запуск V2: snapshot создан = ${backupCreated}`,`2. Marker создан = ${markerCreated}`,`3. До изменения primary остался исходным = ${primaryUnchanged}`,`4. После изменения V2 повторный запуск не перезаписал snapshot = ${backupNotOverwritten}`,`5. Восстановление исходного состояния из snapshot = ${restoredOk}`];finish(backupCreated&&markerCreated&&primaryUnchanged&&backupNotOverwritten&&restoredOk,lines);}catch(e){finish(false,['Self-test execution error: '+(e?.stack||e)]);}})();</script></body></html>
