<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Медконтроль — восстановление</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:0 16px}.card{border:1px solid #ddd;border-radius:12px;padding:18px}.ok{font-weight:700}.bad{font-weight:700}</style></head><body><h1>Проверка локальных записей</h1><div class="card"><p id="origin"></p><p id="result">Проверка…</p></div><script>const KEY='affixo_medcontrol_standard_v3';document.getElementById('origin').textContent='Адрес: '+location.origin;try{const raw=localStorage.getItem(KEY);if(!raw){document.getElementById('result').textContent='Локальных записей нет.';}else{const s=JSON.parse(raw);const m=Array.isArray(s.medications)?s.medications.length:0;const h=Array.isArray(s.intakeLogs)?s.intakeLogs.length:0;document.getElementById('result').textContent='НАЙДЕНО. Препаратов: '+m+'; записей истории: '+h;document.getElementById('result').className='ok';}}catch(e){document.getElementById('result').textContent='Ошибка чтения: '+e.message;document.getElementById('result').className='bad';}</script></body></html>
